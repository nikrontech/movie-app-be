spring:
  application:
    name: movie-app-be
  mongodb:
    uri: mongodb://admin:changeme@localhost:27017/movieApp?authSource=admin

logging:
  level: {}

omdb:
  enabled: true
  not-found-cooldown-hours: 24
  base-url: "https://www.omdbapi.com/"
  api-key: "fab7806c"

url:
  api:
    cinemas:
      pasaka:
        films: "https://api.pasaka.lt/movies?include=mpaaRating,genres,collections&project_identifier=pasaka"
        filters: "https://api.pasaka.lt/filters?project_identifier=pasaka"
      vue:
        cinemas: "https://vuekinas.lt/api/sitecore/WhatsOn/WhatsOnV2GetCinemas"
        filters: "https://vuekinas.lt/api/sitecore/WhatsOn/WhatsOnV2GetFilters?cinemaId=1001"
        films: "https://vuekinas.lt/api/sitecore/WhatsOn/WhatsOnV2Alphabetic?cinemaId=1001"
        schedule: "https://vuekinas.lt/api/sitecore/WhatsOn/WhatsOnV2Hours?cinemaId=1001"
      forum:
        cinemas: "https://restapi.forumcinemas.lt/api/cinema"
        movies: "https://restapi.forumcinemas.lt/api/movie"
        genres: "https://restapi.forumcinemas.lt/api/genres"

youtube:
  downloader:
    executable: yt-dlp
    output-directory: ./downloads/videos
    format: "bestvideo*+bestaudio/best"
    extractor-args: "youtube:player_client=android"
    timeout-seconds: 300

image:
  downloader:
    output-directory: ./downloads/images
    max-file-size-bytes: 10485760

video:
  downloader:
    output-directory: ./downloads/videos
    max-file-size-bytes: 524288000

cinema:
  sync:
    enabled: true
    initial-delay-ms: 1000
    fixed-delay-ms: 86400000
    pasaka:
      enabled: false
    vue:
      enabled: false
    forum:
      enabled: false
    apollo:
      enabled: true
  merge:
    enabled: true
  omdb:
    enabled: false
